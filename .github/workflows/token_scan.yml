name: Token Scan (Duration Analysis)

# ============================================================
# Universal Token Accumulation Scanner
# 
# Runs weekly full scan of 18 tracked tokens (Monday) 
# and daily refresh of current STRONG_BUY tokens.
# 
# Cost: ~2900/4000 credits/month (Dune Analyst tier)
# ============================================================

on:
  schedule:
    # Monday 05:00 UTC = 08:00 MSK · Weekly full scan (all 18 tokens)
    - cron: '0 5 * * 1'
    # Every day 04:00 UTC = 07:00 MSK · Daily STRONG_BUY refresh (~5 tokens)
    - cron: '0 4 * * *'
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: true
        default: 'weekly_full'
        type: choice
        options:
          - weekly_full
          - daily_strong_buy
          - single_token
      token:
        description: 'Single token (if mode=single_token)'
        required: false
        default: 'LINK'

jobs:
  token_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install dune-client requests
      
      - name: Prepare directories
        run: mkdir -p data/cache/token_scan
      
      - name: Run token scan (weekly full — all 18 tokens)
        if: |
          github.event.schedule == '0 5 * * 1' ||
          github.event.inputs.mode == 'weekly_full'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py
      
      - name: Run token scan (daily STRONG_BUY only)
        if: |
          github.event.schedule == '0 4 * * *' ||
          github.event.inputs.mode == 'daily_strong_buy'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py --strong-buy-only
      
      - name: Run token scan (single token, manual)
        if: github.event.inputs.mode == 'single_token'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py --token ${{ github.event.inputs.token }}
      
      - name: Commit cache
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: token_scan cache refresh [skip ci]"
            git push || (git pull --rebase && git push) || echo "Push failed"
          fi
