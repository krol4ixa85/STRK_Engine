name: STRK Feature Snapshot

# ============================================================
# ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ДЖОБ В strk_engine.yml — НАМЕРЕННО.
#
# 1. Кредиты Dune. Здесь их не тратится НИ ОДНОГО. Срез читает
#    только уже собранные кэши, контекст рынка ходит в публичный
#    API Hyperliquid без ключа. Держа файл отдельно, невозможно
#    случайно зацепить джоб со сбором и сжечь кредиты.
#
# 2. Надёжность. strk_engine.yml — 1536 строк и 34 джоба. Если
#    там что-то падает, срез не должен падать вместе с ним.
#    Пропущенный день срез не восстановит: значение исчезает.
#
# ЧТО ДЕЛАЕТ
# 1) Дописывает срез значений всех детекторов в
#    data/history/features/<дата>.jsonl — это невосстановимо,
#    поэтому шаг обязательный и падение job'а здесь оправдано.
# 2) Считает контекст рынка для шапки дашборда
#    (data/cache/market_context.json) — этот шаг с
#    continue-on-error: пропущенный день восстановится сам.
# ============================================================

on:
  schedule:
    # Через 20 минут после основных сборов: 08:00, 14:00, 20:00 UTC.
    # Три раза в сутки, а не один — если один прогон совпадёт с
    # неудачей коллектора, останутся два других.
    - cron: '20 8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strk-features
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install --quiet rule-engine numpy

      - name: Записать срез
        run: python3 scripts/feature_snapshot.py

      # Контекст рынка для шапки дашборда: синхронность, ширина,
      # перекос плеча. Живёт здесь, потому что тоже не тратит кредиты —
      # свечи и фандинг берутся у Hyperliquid, ключ не нужен.
      #
      # continue-on-error: если биржа не ответила, срез детекторов от
      # этого страдать не должен. Пропущенный день контекста не страшен,
      # пропущенный день среза — невосстановим.
      - name: Контекст рынка
        run: python3 scripts/market_context.py
        continue-on-error: true

      - name: Сколько накоплено
        run: python3 scripts/feature_snapshot.py --stats
        continue-on-error: true

      - name: Закоммитить
        run: |
          git config user.name  "strk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history/features/ \
                  data/cache/feature_snapshot_status.json \
                  data/cache/market_context.json

          if git diff --cached --quiet; then
            echo "Изменений нет — коммитить нечего"
            exit 0
          fi

          git commit -m "chore(features): snapshot $(date -u +%Y-%m-%dT%H:%M) [skip ci]"

          # Пуш с повтором: боты коммитят часто, гонка за main —
          # штатная ситуация. Без повтора срез молча теряется при
          # зелёном статусе джоба, это уже случалось.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Запушено с попытки $i"
              exit 0
            fi
            echo "Попытка $i не прошла, подтягиваю и пробую снова"
            git pull --rebase -X theirs origin main || true
            sleep $((i * 5))
          done

          echo "::error::Срез не запушен после 5 попыток"
          exit 1
