name: STRK Engine Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  composite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Run all data collectors + composite signal v2
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
          STRICT_NO_TRADING: 'true'
        run: python3 scripts/collectors/run_all_collectors.py

      - name: Also run orchestrator (flow map for MUST #6)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
          STRICT_NO_TRADING: 'true'
        run: python3 scripts/orchestrator.py || true
      
      - name: Compute liquidity shift (Ekubo pools + Endur LST + native staking)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
          STRICT_NO_TRADING: 'true'
        run: |
          python3 scripts/collectors/ekubo_flow.py || true
          python3 scripts/collectors/endur_lst_flow.py || true
          python3 scripts/collectors/native_staking_flow.py || true
          python3 scripts/detectors/liquidity_shift.py || true

      - name: Auto-discovery scan (find new large addresses)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
          STRICT_NO_TRADING: 'true'
        run: python3 scripts/detectors/auto_discovery.py || true

      - name: Cross-window pattern detection
        run: python3 scripts/detectors/cross_window_pattern.py || true

      - name: Auto-decision layer (accept/reject/queue)
        run: python3 scripts/detectors/decision_layer.py || true

      - name: Compute Wyckoff phase (main)
        run: python3 scripts/detectors/wyckoff_phase.py

      - name: Compute event calendar signal
        run: python3 scripts/detectors/event_calendar.py || true

      - name: Compute funding regime signal
        run: python3 scripts/detectors/funding_signal.py || true

      - name: Compute unlock signal
        run: python3 scripts/detectors/unlock_signal.py || true

      - name: Compute concentration metrics
        run: python3 scripts/detectors/concentration_metrics.py || true

      - name: Compute effort/result signal
        run: python3 scripts/detectors/effort_result.py || true

      - name: Compute CVD analysis
        run: python3 scripts/detectors/cvd_analysis.py || true

      - name: Compute CEX flow analysis
        run: python3 scripts/detectors/cex_flow.py || true

      - name: Compute technical momentum
        run: python3 scripts/detectors/technical_momentum.py || true

      - name: Compute cross-token correlation
        run: python3 scripts/detectors/cross_token_correlation.py || true

      - name: Compute event layer (calendar impact)
        run: python3 scripts/detectors/event_layer.py || true

      - name: Compute Confluence Gate (multi-signal decision)
        run: python3 scripts/detectors/confluence_gate.py || true
      
      # === SHADOW LAYER (STATUS: HYPOTHESIS, does NOT affect decisions) ===
      - name: Shadow postmortem — close PENDING shadow forecasts
        run: python3 scripts/detectors/shadow_postmortem.py || true
      
      - name: Shadow voter — write new shadow votes (72h + 7d)
        env:
          STRK_RUN_ID: shadow_${{ github.run_id }}
        run: python3 scripts/detectors/shadow_voter.py || true
      # === END SHADOW LAYER ===
      
      # === COVERT FLOW + HISTORY LAYER (v1) ===
      - name: Covert flow detector (shadow, reads edges CSV from orchestrator)
        env:
          STRICT_NO_TRADING: 'true'
        run: python3 scripts/detectors/covert_flow_detector.py || true
      
      - name: History postmortem — close PENDING all_history records
        run: python3 scripts/history_postmortem.py || true
      
      - name: History accumulator — write compact snapshot for this RUN
        env:
          STRK_RUN_ID: hist_${{ github.run_id }}_${{ github.run_number }}
        run: python3 scripts/history_accumulator.py || true
      # === END COVERT FLOW + HISTORY LAYER ===

      - name: Compute interpretation layer (narrative synthesis)
        run: python3 scripts/detectors/interpretation_layer.py || true

      - name: Compute scenario engine (Bull/Base/Bear)
        run: python3 scripts/detectors/scenario_engine.py || true

      - name: Auto post-mortem (evaluate PENDING forecasts)
        run: python3 scripts/detectors/auto_postmortem.py || true

      - name: Weekly cohort analysis (Sunday only)
        if: github.event.schedule == '0 12 * * 0' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/detectors/weekly_cohort_analysis.py || true

      - name: Cohort tracker snapshot
        run: python3 scripts/detectors/cohort_tracker.py || true

      - name: Whale auto-analysis
        run: python3 scripts/detectors/whale_auto_analysis.py || true

      - name: Send unified digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/daily_digest.py

      - name: Generate RUN report (HTML)
        run: python3 scripts/run_report.py || true

      - name: Commit updated seeds + history + liquidity cache + reports
        run: |
          mkdir -p data/history data/cache data/reports
          # state files ДОЛЖНЫ быть в git — GitHub Actions cache ненадёжен для delta-24h.
          # HTML отчёты тоже коммитим (иначе data/reports/ теряется с эфемерным раннером).
          # alerts.jsonl + shadow_votes.jsonl + all_history.jsonl — persistence для калибровки.
          if git diff --quiet \
              data/seeds/flow_seeds.json \
              data/history/cohort_snapshots.jsonl \
              data/history/forecasts.jsonl \
              data/history/postmortems.jsonl \
              data/history/shadow_votes.jsonl \
              data/history/all_history.jsonl \
              data/history/alerts.jsonl \
              data/cache/native_staking_state.json \
              data/cache/liquidity_shift.json \
              data/cache/ekubo_flow.json \
              data/cache/endur_lst_flow.json \
              data/cache/native_staking_flow.json \
              data/cache/covert_flow_signal.json \
              data/cache/shadow_calibration.json 2>/dev/null && \
             [ -z "$(git status --porcelain data/reports/)" ]; then
            echo "No changes"
          else
            git config user.email "bot@github.com"
            git config user.name "STRK Engine Bot"
            git add data/seeds/flow_seeds.json \
                    data/history/cohort_snapshots.jsonl \
                    data/history/forecasts.jsonl \
                    data/history/postmortems.jsonl \
                    data/history/shadow_votes.jsonl \
                    data/history/all_history.jsonl \
                    data/history/alerts.jsonl \
                    data/cache/native_staking_state.json \
                    data/cache/liquidity_shift.json \
                    data/cache/ekubo_flow.json \
                    data/cache/endur_lst_flow.json \
                    data/cache/native_staking_flow.json \
                    data/cache/covert_flow_signal.json \
                    data/cache/shadow_calibration.json \
                    data/reports/ 2>/dev/null || true
            git commit -m "chore: history + liquidity + reports + alerts [skip ci]" || echo "Nothing to commit"
            git push || echo "Push failed"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: strk-signal
          path: |
            data/cache/composite_signal_v2.json
            data/cache/agent_input.json
            data/cache/cross_window_pattern.json
            data/cache/whale_analysis.json
            data/cache/cohort_tracker.json
            data/cache/wyckoff_phase.json
            data/cache/interpretation.json
            data/cache/concentration_metrics.json
            data/cache/effort_result.json
            data/cache/cvd_analysis.json
            data/cache/cex_flow.json
            data/cache/technical_momentum.json
            data/cache/scenario_analysis.json
            data/cache/scenarios/
            data/cache/decision_log.json
            data/cache/liquidity_shift.json
            data/cache/ekubo_flow.json
            data/cache/endur_lst_flow.json
            data/cache/native_staking_flow.json
            data/cache/covert_flow_signal.json
            data/cache/shadow_calibration.json
            data/history/shadow_votes.jsonl
            data/history/all_history.jsonl
            data/history/alerts.jsonl
            data/dashboards/
            data/graphs/
            data/reports/
