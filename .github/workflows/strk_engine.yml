# ============================================================
# ADD THIS JOB TO strk_engine.yml (после weekly_token_scan)
# 
# STRK-specific scanner via AVNU (Starknet native DEX)
# Runs daily 06:30 UTC = 09:30 MSK
# ============================================================

  strk_avnu_scan:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'strk_avnu')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install dune-client requests
      - name: Fetch STRK from AVNU
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_STRK_AVNU: ${{ secrets.DUNE_QUERY_ID_STRK_AVNU }}
        run: python3 token_scan/strk_avnu_collector.py
      - name: Commit cache
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/STRK.json
          git diff --cached --quiet || git commit -m "chore: STRK AVNU scan [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

