name: STRK Feature Snapshot

# ============================================================
# ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ДЖОБ В strk_engine.yml — НАМЕРЕННО.
#
# 1. Кредиты Dune. Этот воркфлоу не делает НИ ОДНОГО сетевого
#    запроса: читает только те кэши, которые уже собраны. Держа
#    его отдельно, невозможно случайно зацепить джоб со сбором
#    и сжечь кредиты.
#
# 2. Надёжность. strk_engine.yml — 1536 строк и 34 джоба. Если
#    там что-то падает, срез не должен падать вместе с ним.
#    Пропущенный день срез не восстановит: значение исчезает.
#
# ЧТО ДЕЛАЕТ
# Дописывает срез значений всех детекторов в
# data/history/features/<дата>.jsonl и коммитит.
# ============================================================

on:
  schedule:
    # Через 20 минут после основных сборов: 08:00, 14:00, 20:00 UTC.
    # Три раза в сутки, а не один — если один прогон совпадёт с
    # неудачей коллектора, останутся два других.
    - cron: '20 8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strk-features
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install --quiet rule-engine

      - name: Записать срез
        run: python3 scripts/feature_snapshot.py

      - name: Сколько накоплено
        run: python3 scripts/feature_snapshot.py --stats
        continue-on-error: true

      - name: Закоммитить
        run: |
          git config user.name  "strk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history/features/ data/cache/feature_snapshot_status.json

          if git diff --cached --quiet; then
            echo "Изменений нет — коммитить нечего"
            exit 0
          fi

          git commit -m "chore(features): snapshot $(date -u +%Y-%m-%dT%H:%M) [skip ci]"

          # Пуш с повтором: боты коммитят часто, гонка за main —
          # штатная ситуация. Без повтора срез молча теряется при
          # зелёном статусе джоба, это уже случалось.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Запушено с попытки $i"
              exit 0
            fi
            echo "Попытка $i не прошла, подтягиваю и пробую снова"
            git pull --rebase -X theirs origin main || true
            sleep $((i * 5))
          done

          echo "::error::Срез не запушен после 5 попыток"
          exit 1
