name: STRK Engine Automation

on:
  schedule:
    # Основной digest 3 раза в день (08:00 / 14:00 / 20:00 UTC)
    - cron: '0 8,14,20 * * *'
    # LAB режим — 2 раза в сутки (утро 08:30 UTC = 11:30 MSK, вечер 20:30 UTC = 23:30 MSK)
    # Cache queries обновляются 2 раза, credits использование в бюджете Analyst tier
    - cron: '30 8,20 * * *'
    # Weekly LAB summary — воскресенье 21:00 UTC = 00:00 MSK понедельника
    - cron: '0 21 * * 0'
    # Еженедельный backtest: воскресенье 00:00 UTC = 03:00 MSK
    - cron: '0 0 * * 0'
    # v5.2 · Weekly full token scan — понедельник 05:00 UTC = 08:00 MSK
    - cron: '0 5 * * 1'
    # v5.2 · Daily STRONG_BUY token refresh — каждый день 04:00 UTC = 07:00 MSK
    - cron: '0 4 * * *'
    # v5.2 · Weekly FULL RUN Level 4 — понедельник 06:00 UTC = 09:00 MSK
    - cron: '0 6 * * 1'
    # v5.4 · STRK AVNU daily scan — каждый день 03:30 UTC = 06:30 MSK
    - cron: '30 3 * * *'
    # Type A #3 · News impact classifier — 4x/day (00, 06, 12, 18 UTC)
    - cron: '0 0,6,12,18 * * *'
    # Module 1+2 · Macro Narratives (Fed/US10Y/DXY/VIX + TOTAL phase) — 4x/day
    - cron: '15 0,6,12,18 * * *'
    # Interpretation Layer · unified reading, 4x/day (5 min после macro)
    - cron: '20 0,6,12,18 * * *'
    # Market Regime Calculator · weighted regime, 4x/day (2 min после interpretation)
    - cron: '22 0,6,12,18 * * *'
    # Hive Prices · fix price discrepancy, 4x/day (5 min после interpretation)
    - cron: '25 0,6,12,18 * * *'
    # Asset Compass · КАЖДЫЕ 30 МИНУТ, на :50. Сводит ончейн,
    # деривативы и технику в одну шкалу от -100 (шорт) до +100 (лонг).
    # Идёт последним в получасовом цикле — читает свежие phase_analyzer,
    # hl_perps и cvd_multi. Ноль внешних запросов.
    - cron: '50 * * * *'
    # Trade Journal · КАЖДЫЕ 6 ЧАСОВ. Пересчитывает открытые позиции,
    # плавающий PnL и сверку твоих сделок с решениями движка.
    # Ничего не исполняет — только читает записанное вручную.
    - cron: '45 2,8,14,20 * * *'
    # Decision Backtest · ВОСКРЕСЕНЬЕ 06:20 UTC. Прогон правил задним
    # числом по weekly_history. Идёт после воскресного weekly_token_scan
    # (00:00), поэтому история уже обновлена свежей неделей.
    # Ноль внешних запросов — только локальные файлы.
    - cron: '20 6 * * 0'
    # Volume Profile · КАЖДЫЕ 6 ЧАСОВ. POC/VAH/VAL/HVN из бесплатных
    # свечей Hyperliquid. Даёт ЦЕЛИ — куда стремится цена.
    - cron: '35 1,7,13,19 * * *'
    # CVD Multi · КАЖДЫЕ 30 МИНУТ. Агрессия покупателей/продавцов
    # по всем токенам через OKX taker-volume. Ловит дивергенции.
    - cron: '0,30 * * * *'
    # HL Trade Collector · КАЖДЫЕ 15 МИНУТ. Собирает публичные сделки
    # >$500 по 10 нашим ключевым токенам в append-only лог.
    # База для будущего whale-watchlist — за 2-3 дня накопится достаточно
    # адресов чтобы отслеживать их позиции.
    - cron: '5,20,35,50 * * * *'
    # HL Perps · КАЖДЫЕ 30 МИНУТ. Публичный API Hyperliquid, ноль ключей.
    # Даёт funding, premium (mark−oracle), OI по каждому активу.
    # Ключевой сигнал — premium: указывает давление ПРЯМО СЕЙЧАС,
    # без 8-часовой задержки фандинга.
    - cron: '10,40 * * * *'
    # Phase Analyzer · КАЖДЫЕ 30 МИНУТ. Считает ускорение потока и
    # sanity-фильтр битых данных из уже собранных weekly-скана.
    # Ноль Dune запросов — работает на локальных файлах.
    - cron: '15,45 * * * *'
    # Funding per token · КАЖДЫЕ 30 МИНУТ. Источник OKX public — бесплатно,
    # ноль кредитов Hive и Dune. Единственный модуль такой частоты.
    - cron: '*/30 * * * *'
    # Force-all скан всех токенов · раз в 2 недели, суббота 03:00 UTC (~700 кредитов Dune)
    - cron: '0 3 */14 * *'
    # Архивариус · снимок + дельты + ретеншн. Ежедневно 03:50 UTC,
    # через 20 мин после force-скана и за 10 мин до daily_token_scan.
    - cron: '50 3 * * *'
    # Decision Engine · единственный автор решений. Считает через 5 минут
    # после market_regime, чтобы читать уже свежий режим рынка.
    - cron: '27 0,6,12,18 * * *'
    # Decision Engine · проверка прогнозов, срок которых наступил. Раз в сутки.
    - cron: '40 5 * * *'
    # Hive Health · MUST #18 концентрация держателей + MUST #19 глубина 2%
    # Понедельник 02:00 UTC = 05:00 MSK. В это время не запускается ничего
    # другое — ближайшие соседи 03:30 (strk_avnu) и 04:00 (token_scan_daily).
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Delivery mode'
        required: true
        default: 'digest'
        type: choice
        options:
          - digest
          - liq
          - run
          - backtest
          - baseline
          - lab
          - token_scan_weekly
          - token_scan_daily
          - token_scan_force_all
          - strk_avnu
          - news_impact
          - macro_narratives
          - interpretation
          - market_regime
          - hive_prices
          - hive_health
          - hive_health_catalog
          - funding_per_token
          - token_scan_single
          - phase_analyzer
          - hl_perps
          - hl_trades
          - volume_profile
          - cvd_multi
          - decision_backtest
          - trade_journal
          - asset_compass
          - decision_engine
          - decision_verify
          - archivist
          - full_run
      token:
        description: 'Токен для token_scan_single (например LINK). Для других режимов игнорируется.'
        required: false
        default: ''
        type: string

# Global env — все шаги видят все секреты
env:
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  STARKNET_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.STARKNET_ANNOUNCEMENTS_CHANNEL_ID }}
  # Squeeze bot (@strk_dynamic3_bot) — отдельный стрим
  SQUEEZE_BOT_TOKEN: ${{ secrets.SQUEEZE_BOT_TOKEN }}
  SQUEEZE_CHAT_ID: ${{ secrets.SQUEEZE_CHAT_ID }}
  STRICT_NO_TRADING: 'true'

jobs:
  composite:
    # Запускается ТОЛЬКО на digest schedule ИЛИ явно mode: digest/liq/run/backtest/baseline/lab
    if: >
      (github.event_name == 'schedule' && 
        (github.event.schedule == '0 8,14,20 * * *' 
         || github.event.schedule == '30 8,20 * * *'
         || github.event.schedule == '0 21 * * 0'
         || github.event.schedule == '0 0 * * 0'))
      || (github.event_name == 'workflow_dispatch' 
        && contains(fromJson('["digest","liq","run","backtest","baseline","lab"]'), github.event.inputs.mode))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Prepare directories
        run: mkdir -p data/history data/cache data/reports data/validation data/dashboards data/graphs

      # ============================================================
      # STAGE 1 · MASTER COLLECTORS (all in one script)
      # ============================================================
      - name: Run all collectors (master entry)
        run: |
          if [ -f scripts/collectors/run_all_collectors.py ]; then
            python3 scripts/collectors/run_all_collectors.py
          else
            echo "::warning::scripts/collectors/run_all_collectors.py NOT FOUND - fallback: skip collectors"
          fi

      # STAGE 1.5 · DUNE COLLECTOR (Starknet ecosystem stats)
      # Cache 20h daily / 6d weekly / 5d monthly / 24h cex_flow — economy на free tier.
      # Тихо skipped если DUNE_API_KEY не установлен.
      - name: Dune collector · Starknet stats
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_DAILY: ${{ secrets.DUNE_QUERY_ID_DAILY }}
          DUNE_QUERY_ID_WEEKLY: ${{ secrets.DUNE_QUERY_ID_WEEKLY }}
          DUNE_QUERY_ID_MONTHLY: ${{ secrets.DUNE_QUERY_ID_MONTHLY }}
          DUNE_QUERY_ID_CEX_FLOW: ${{ secrets.DUNE_QUERY_ID_CEX_FLOW }}
        run: python3 scripts/collectors/dune_collector.py || true

      # STAGE 1.55 · SECTOR ROTATION COLLECTOR (для LAB режима)
      # Запускается ТОЛЬКО при mode=lab или cron 08:30 UTC
      # Экономим Analyst tier credits — не qazhe run
      - name: Dune sector collector (LAB)
        if: github.event.inputs.mode == 'lab' || github.event.schedule == '30 8,20 * * *'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_SECTOR_NETFLOW: ${{ secrets.DUNE_QUERY_ID_SECTOR_NETFLOW }}
          DUNE_QUERY_ID_SECTOR_MOMENTUM: ${{ secrets.DUNE_QUERY_ID_SECTOR_MOMENTUM }}
        run: python3 scripts/collectors/dune_sector_collector.py || true

      # STAGE 1.56 · ALT-CYCLE COLLECTOR (macro compass)
      # Собирает BTC.D + ETH/BTC + TOTAL3 из CoinGecko (free API).
      # Определяет текущую phase alt-cycle (CASH/BTC/ETH/ALT/EUPHORIA/DIST).
      # Cache 4h → запускается на every run, но реально API calls ~6x/day.
      # Показывается в dashboard как top-level macro context.
      - name: Alt-cycle collector (macro compass)
        run: python3 scripts/collectors/alt_cycle_collector.py || true

      # STAGE 1.57 · DEFILLAMA COLLECTOR (TVL по chains)
      # Free API, показывает где реально капитал сидит в DeFi.
      # Cache 6h.
      - name: DeFiLlama collector (TVL)
        run: python3 scripts/collectors/defillama_collector.py || true

      # STAGE 1.58 · FUNDING COLLECTOR (perpetual funding rates)
      # CoinGecko derivatives — funding для major tokens + top gainers/losers.
      # Cache 30 min.
      - name: Funding collector (perp funding)
        run: python3 scripts/collectors/funding_collector.py || true

      # STAGE 1.59 · STABLES COLLECTOR (dry powder tracking)
      # Общий marketcap стейблов = "сухой порох" рынка.
      # Cache 4h.
      - name: Stables collector (dry powder)
        run: python3 scripts/collectors/stables_collector.py || true

      # STAGE 1.60 · DUNE EXTENDED (DISABLED · queries too heavy)
      # Fork community dashboards хорошая идея но:
      # - Whale movements query cost > tier limit → HTTP 402 Payment Required
      # - Failed executions still charge credits (~500+ credits за попытку)
      # - Community queries не оптимизированы для API polling
      #
      # Оставлено закомментированным. Разкомментируй когда:
      # 1. Найдёшь LEGKOVESные queries (< 100 credits/execute)
      # 2. Или напишешь свои custom SQL (можно контролировать cost)
      # 3. Или мигрируешь на Plus tier ($390/mo)
      #
      # Пока используются свободные data sources (defillama, coingecko).
      # Whale monitoring покрывается existing whale_monitor.py.
      #
      # - name: Dune extended collector (forked queries) [DISABLED]
      #   env:
      #     DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      #     DUNE_QUERY_ID_WHALES_24H: ${{ secrets.DUNE_QUERY_ID_WHALES_24H }}
      #     DUNE_QUERY_ID_STARKNET_DAU: ${{ secrets.DUNE_QUERY_ID_STARKNET_DAU }}
      #     DUNE_QUERY_ID_STARKNET_NEW_WALLETS: ${{ secrets.DUNE_QUERY_ID_STARKNET_NEW_WALLETS }}
      #   run: python3 scripts/collectors/dune_extended_collector.py || true

      # STAGE 1.65 · WHALE HOLDINGS COLLECTOR (weekly cadence, smart selection)
      # Использует твою параметризованную query 8374340 через API.
      # Cadence: weekly (внутри скрипта проверяется MIN_INTERVAL_HOURS=168).
      # Tokens: STRK (always) + STRONG_BUY current + recently EXITED (max 5 per run).
      # Cost: ~25 credits per token × 5 = ~125/week = ~500/mo. Fits в Free tier.
      #
      # Weekly cron trigger внутри скрипта — safe даже если workflow runs daily
      # (просто skip если < 7 дней с last run).
      - name: Whale holdings collector (weekly)
        if: github.event.inputs.mode == 'lab' || github.event.schedule == '30 8,20 * * *' || github.event.schedule == '0 12 * * 0'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_WHALE_HOLDINGS: ${{ secrets.DUNE_QUERY_ID_WHALE_HOLDINGS }}
          WHALE_HOLDINGS_MAX_TOKENS: "5"
          WHALE_HOLDINGS_MIN_INTERVAL_HOURS: "168"
        run: python3 scripts/collectors/whale_holdings_collector.py || true

      # STAGE 1.99 · SYSTEM HEALTH AUDIT
      # Проверяет что все collectors/detectors/pipeline работают.
      # Сохраняет data/cache/system_health.json для dashboard.
      # Запускается на every workflow run (быстро — только read операции).
      - name: System health audit
        run: python3 scripts/audit_system.py || true

      # STAGE 1.56 · ROTATION TRACKER (детектор изменений в LAB signals)
      # Читает snapshot от strk_lab.py (data/cache/strk_lab_report.json)
      # → alert в @Lab_sector_bot при NEW_STRONG_BUY / DIVERGENCE_WARN / EXIT / CONFIRMED_HOLD_3D
      # Запускается ПОСЛЕ strk_lab.py — поэтому лучше в step после LAB (STAGE 8.5)

      # STAGE 1.6 · CEX FLOW ALERT (detect DISTRIBUTION → ACCUMULATION transitions)
      # Читает existing cex_flow.json (обновляется в STAGE 1 через Etherscan).
      # Real-time каждый час — реагирует на flip, без Dune credits.
      # Alert в @strk_dynamic3_bot с dedup 24h.
      - name: CEX flow alert detector
        run: python3 scripts/detectors/cex_flow_alert.py || true

      # ============================================================
      # STAGE 2 · Liquidity/staking (в отдельной секции, у них своя логика)
      # ============================================================
      - name: Liquidity shift chain (ekubo + endur + native staking + shift)
        run: |
          python3 scripts/collectors/ekubo_flow.py || true
          python3 scripts/collectors/endur_lst_flow.py || true
          python3 scripts/collectors/native_staking_flow.py || true
          python3 scripts/detectors/liquidity_shift.py || true

      # ============================================================
      # STAGE 3 · ORCHESTRATOR (flow map from edges)
      # ============================================================
      - name: Orchestrator (flow map)
        run: python3 scripts/orchestrator.py || true

      # ============================================================
      # STAGE 4 · DETECTORS
      # ============================================================
      - name: Auto-discovery
        run: python3 scripts/detectors/auto_discovery.py || true

      # Watchlist notifier — только при mode=digest (не спамить при каждом cron)
      # Так лента WATCH? синхронизируется с daily heartbeat, не с каждым LIQ/RUN
      - name: Watchlist notifier (WATCH? candidates)
        if: github.event.inputs.mode == 'digest' || github.event.schedule == '0 18 * * *' || github.event_name == 'schedule' && github.event.schedule == '0 18 * * *'
        run: python3 scripts/detectors/watchlist_notifier.py || true

      - name: Cross-window pattern
        run: python3 scripts/detectors/cross_window_pattern.py || true

      - name: Auto-decision layer
        run: python3 scripts/detectors/decision_layer.py || true

      # ⚡ Composite v2 (main brain) — writes composite_signal_v2.json
      - name: Composite detector v2 (main brain)
        env:
          COMPOSITE_SILENT: 'true'
        run: python3 scripts/detectors/composite_detector_v2.py || true

      - name: Wyckoff phase
        run: python3 scripts/detectors/wyckoff_phase.py || true

      - name: Event calendar
        run: python3 scripts/detectors/event_calendar.py || true

      - name: Concentration metrics
        run: python3 scripts/detectors/concentration_metrics.py || true

      # ⚡ Bridge activity — writes bridge_activity.json
      - name: Bridge activity
        run: python3 scripts/detectors/bridge_activity.py || true

      - name: Effort/result
        run: python3 scripts/detectors/effort_result.py || true

      - name: CVD analysis
        run: python3 scripts/detectors/cvd_analysis.py || true

      - name: CEX flow analysis
        run: python3 scripts/detectors/cex_flow.py || true

      - name: Technical momentum
        run: python3 scripts/detectors/technical_momentum.py || true

      - name: Cross-token correlation
        run: python3 scripts/detectors/cross_token_correlation.py || true

      - name: News aggregator
        run: python3 scripts/detectors/news_aggregator.py || true

      - name: Twitter nitter
        run: python3 scripts/detectors/twitter_nitter.py || true

      - name: Event layer
        run: python3 scripts/detectors/event_layer.py || true

      - name: Confluence Gate (multi-signal decision)
        run: python3 scripts/detectors/confluence_gate.py || true

      # STAGE 5 · SHADOW LAYER
      - name: Shadow postmortem
        run: python3 scripts/detectors/shadow_postmortem.py || true
      - name: Shadow voter
        env:
          STRK_RUN_ID: shadow_${{ github.run_id }}
        run: python3 scripts/detectors/shadow_voter.py || true

      # STAGE 6 · COVERT FLOW + HISTORY
      - name: Covert flow detector
        run: python3 scripts/detectors/covert_flow_detector.py || true
      - name: History postmortem
        run: python3 scripts/history_postmortem.py || true
      - name: History accumulator
        env:
          STRK_RUN_ID: hist_${{ github.run_id }}_${{ github.run_number }}
        run: python3 scripts/history_accumulator.py || true

      # STAGE 7 · SYNTHESIS
      - name: Interpretation layer
        run: python3 scripts/detectors/interpretation_layer.py || true
      - name: Scenario engine
        run: python3 scripts/scenario_engine.py || true
      - name: Cohort tracker
        run: python3 scripts/detectors/cohort_tracker.py || true
      - name: Whale auto-analysis
        run: python3 scripts/detectors/whale_auto_analysis.py || true

      # STAGE 7.5 · SQUEEZE DETECTION (отдельный стрим в @strk_dynamic3_bot)
      - name: Squeeze detector (compute state)
        run: python3 scripts/detectors/squeeze_detector.py || true

      - name: Squeeze notifier (alert to @strk_dynamic3_bot)
        run: python3 scripts/detectors/squeeze_notifier.py || true

      # STAGE 7.6 · DYNAMIC EXIT SIGNALS (для активных squeeze positions)
      - name: Dynamic exit signals
        run: python3 scripts/detectors/dynamic_exit_signals.py || true

      # STAGE 7.9 · WEEKLY BACKTEST (только воскресенье 00:00 UTC или mode=backtest)
      - name: Weekly backtest
        if: github.event.schedule == '0 0 * * 0' || github.event.inputs.mode == 'backtest'
        run: python3 scripts/weekly_backtest.py || true

      # STAGE 7.95 · BASELINE ANALYSIS (mode=baseline)
      - name: Install baseline deps
        if: github.event.inputs.mode == 'baseline'
        run: pip install pandas numpy ccxt pyarrow

      - name: STRK baseline analysis
        if: github.event.inputs.mode == 'baseline'
        run: python3 scripts/strk_baseline_analysis.py || true

      # STAGE 8 · HTML REPORT (генерируется ДО отправки, чтобы run mode мог прицепить)
      - name: Generate RUN report (HTML)
        run: python3 scripts/run_report.py || true

      # STAGE 8.5 · LAB REPORT (Portfolio Rotation Compass)
      # Отправляется в @Lab_sector_bot (не @STRK_GUARDIAN_BOT)
      # Запускается при cron 08:30 UTC или ручном mode=lab
      # ВАЖНО: сохраняет data/cache/strk_lab_report.json для rotation_tracker
      - name: STRK LAB · Portfolio Rotation report
        if: github.event.inputs.mode == 'lab' || github.event.schedule == '30 8,20 * * *'
        env:
          TELEGRAM_LAB_SECTOR_BOT: ${{ secrets.TELEGRAM_LAB_SECTOR_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/strk_lab.py || true

      # STAGE 8.6 · ROTATION TRACKER (детектор изменений от LAB snapshot)
      # Запускается после LAB чтобы прочитать свежий strk_lab_report.json
      # Alert в @Lab_sector_bot при: NEW_STRONG_BUY, DIVERGENCE_WARN, EXIT, CONFIRMED_HOLD_3D
      - name: Rotation tracker (LAB signals changes)
        if: github.event.inputs.mode == 'lab' || github.event.schedule == '30 8,20 * * *'
        env:
          TELEGRAM_LAB_SECTOR_BOT: ${{ secrets.TELEGRAM_LAB_SECTOR_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/detectors/rotation_tracker.py || true

      # STAGE 8.7 · BACKTEST · RECORDER (записывает STRONG_BUY signals для measurement)
      # Каждый LAB run пишет currently STRONG_BUY tokens → lab_signals.jsonl (PENDING)
      # Через 7 дней verifier закрывает и считает HIT/MISS/NEUTRAL.
      - name: LAB signals recorder (backtest data collection)
        if: github.event.inputs.mode == 'lab' || github.event.schedule == '30 8,20 * * *'
        run: python3 scripts/detectors/lab_signals_recorder.py || true

      # STAGE 8.8 · BACKTEST · VERIFIER (закрывает PENDING старше 7d + строит summary)
      # Reads current prices from momentum snapshot, updates records, writes summary.
      # Worker /check <TOKEN> читает summary для показа реальной precision.
      - name: LAB signals verifier (close PENDING, build summary)
        if: github.event.inputs.mode == 'lab' || github.event.schedule == '30 8,20 * * *'
        run: python3 scripts/detectors/lab_signals_verifier.py || true

      # STAGE 8.9 · WEEKLY SUMMARY (воскресенье 21:00 UTC = 00:00 MSK понедельника)
      # Аггрегирует 7 дней LAB активности → отчёт в @Lab_sector_bot
      # Также обновляет data/cache/weekly_summary.json для команды /week
      - name: Weekly LAB summary
        if: github.event.schedule == '0 21 * * 0' || github.event.inputs.mode == 'lab'
        env:
          TELEGRAM_LAB_SECTOR_BOT: ${{ secrets.TELEGRAM_LAB_SECTOR_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/weekly_summary.py || true

      # STAGE 9 · SEND (MODE = digest | liq | run)
      # SKIP если mode=backtest, baseline, lab (у них свои pipelines)
      - name: Send Telegram delivery
        if: github.event.schedule != '0 0 * * 0' && github.event.schedule != '30 8,20 * * *' && github.event.schedule != '0 21 * * 0' && github.event.inputs.mode != 'backtest' && github.event.inputs.mode != 'baseline' && github.event.inputs.mode != 'lab'
        env:
          MODE: ${{ github.event.inputs.mode || 'digest' }}
        run: |
          echo "=== Delivery MODE=$MODE ==="
          python3 scripts/daily_digest.py || echo "delivery failed"

      # STAGE 10 · PERSISTENCE (bulletproof — commits ALL data/ changes)
      - name: Commit state files
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          # git add -A подхватывает и modified и untracked — новые jsonl файлы
          # (discovery_candidates, whale_events, squeeze_alerts) больше не теряются.
          git add -A data/
          # --cached — проверяем что реально в staging area
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "=== Changes to commit: ==="
            git diff --cached --stat
            git commit -m "chore: state update (mode=${{ github.event.inputs.mode || 'digest' }}) [skip ci]"
            # retry push с rebase если удалённое было обновлено параллельным run
            git push || (git pull --rebase && git push) || echo "Push failed"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: strk-signal
          # Bulletproof: upload ВСЕ data/ (cache + history + reports).
          # Раньше list был partial → LAB/alt_cycle/funding/etc не попадали в артефакт,
          # даже когда реально создавались. Теперь всё видно в скачанном ZIP.
          path: |
            data/cache/
            data/history/
            data/reports/
            data/dashboards/
            data/graphs/
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # v5.2 · TOKEN SCAN (weekly full + daily STRONG_BUY refresh)
  # ============================================================
  weekly_token_scan:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'token_scan_weekly')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install dune-client requests
      - name: Run weekly token scan (all 18 tokens)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py
      - name: Commit cache
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/
          git diff --cached --quiet || git commit -m "chore: weekly token scan cache refresh [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  force_all_token_scan:
    # Раз в две недели, суббота 03:00 UTC. Не еженедельно: полный форс
    # стоит ~700 кредитов Dune, при бюджете 4000/мес еженедельный прогон
    # съедал бы 3000 и не оставлял места ни daily-скану, ни composite.
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 3 */14 * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'token_scan_force_all')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install dune-client requests
      - name: Budget gate
        id: gate
        run: python3 scripts/dune_budget.py --check force_all_token_scan
      - name: FORCE refresh ALL tokens (ignore freshness cache)
        if: steps.gate.outputs.allowed == 'true'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py --force
      - name: Register Dune spend
        if: steps.gate.outputs.allowed == 'true'
        run: python3 scripts/dune_budget.py --spend force_all_token_scan
      - name: Commit cache
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/
          [ -f data/cache/dune_budget.json ] && git add data/cache/dune_budget.json || true
          git diff --cached --quiet || git commit -m "chore: FORCE all token scan refresh [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  daily_token_scan:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'token_scan_daily')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install dune-client requests
      - name: Run daily STRONG_BUY token refresh
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py --strong-buy-only
      - name: Commit cache
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/
          git diff --cached --quiet || git commit -m "chore: daily STRONG_BUY token scan [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # v5.2 · FULL RUN Level 4 (weekly deep report)
  # ============================================================
  full_run:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full_run')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate FULL RUN
        run: |
          mkdir -p reports
          python3 full_run/generate_full_run.py
      - name: Commit report
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: FULL RUN weekly report [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"
      - name: Telegram notify (best-effort)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_LAB_SECTOR_BOT }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_ID=$(ls reports/FULL_RUN_R*.html 2>/dev/null | sort -V | tail -1 | grep -oE 'R[0-9]+' | head -1)
          MSG="📊 FULL RUN ${RUN_ID:-новый} готов%0A%0Ahttps://krol4ixa85.github.io/STRK_Engine/reports/latest.html"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" || true

  # ============================================================
  # STRK SCENARIOS · генерирует сценарии для бота
  # ============================================================
  strk_scenarios:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 8,20 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'lab')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate STRK scenarios
        run: python3 scenarios/strk_scenarios.py
      - name: Commit scenarios
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/strk_scenarios.json
          git diff --cached --quiet || git commit -m "chore: scenarios [skip ci]"
          git push

  # ============================================================
  # v5.4 · STRK-specific Scanner via AVNU (Starknet native DEX)
  # Daily 03:30 UTC = 06:30 MSK
  # ============================================================
  strk_avnu_scan:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'strk_avnu')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install dune-client requests
      - name: Fetch STRK from AVNU DEX (Starknet)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_STRK_AVNU: ${{ secrets.DUNE_QUERY_ID_STRK_AVNU }}
        run: python3 token_scan/strk_avnu_collector.py
      - name: Commit STRK.json cache
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/STRK.json
          git diff --cached --quiet || git commit -m "chore: STRK AVNU scan [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Type A #3 · News Impact Classifier · 4x/day
  # ============================================================
  news_impact:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 0,6,12,18 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'news_impact')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Surf CLI (v5 · correct paths)
        run: |
          echo "Installing Surf CLI..."
          curl -fsSL https://downloads.asksurf.ai/cli/releases/install.sh | sh || echo "Surf install failed"
          # Surf installs to ~/.local/bin, add to PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          which surf 2>&1 || echo "surf not in PATH"
          surf version 2>&1 || echo "surf version failed"
      - name: Configure Surf auth (v5)
        env:
          SURF_API_KEY: ${{ secrets.SURF_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v surf >/dev/null 2>&1 && [ -n "$SURF_API_KEY" ]; then
            echo "Authenticating with Surf..."
            surf auth --api-key "$SURF_API_KEY" 2>&1 || echo "surf auth failed"
            surf sync 2>&1 || echo "surf sync failed"
          else
            echo "Skipping surf auth (surf not found or no API key)"
          fi
      - name: Install Python dependencies
        run: pip install feedparser requests
      - name: Classify news impact (v5 · per-token Surf queries)
        env:
          SURF_API_KEY: ${{ secrets.SURF_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 news/news_impact_v5.py
      - name: Commit news outputs (safe)
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          # Add files only if they exist (v3 creates surf_events.json, v1 legacy = news_impact.json)
          [ -f data/cache/surf_events.json ] && git add data/cache/surf_events.json || echo "surf_events.json not found — v3 may have failed"
          [ -f data/cache/news_impact.json ] && git add data/cache/news_impact.json || echo "news_impact.json not found — v1 legacy"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: news impact update [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Module 1+2 · Macro Narratives + TOTAL Phase
  # Free APIs: FRED (optional key), CoinGecko (no key), Yahoo Finance (no key)
  # 4x/day, ~1 second per job (no Dune credits)
  # ============================================================
  macro_narratives:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '15 0,6,12,18 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'macro_narratives')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Collect Macro Narratives (Fed/US10Y/DXY/VIX/Gold)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 macro/macro_narratives.py
      - name: Collect TOTAL/TOTAL3 phase
        run: python3 macro/total_phase.py
      - name: Commit macro outputs
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/macro_narratives.json ] && git add data/cache/macro_narratives.json || echo "no macro_narratives.json"
          [ -f data/cache/total_phase.json ] && git add data/cache/total_phase.json || echo "no total_phase.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: macro narratives + total phase [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Interpretation Layer · unified reading of all signals
  # Reads all cache files, no external calls, ~1 second
  # ============================================================
  interpretation:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '20 0,6,12,18 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'interpretation')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Interpretation Layer
        run: python3 interpretation/interpretation_layer.py
      - name: Commit unified_reading.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          # unified_reading.json — выход interpretation/interpretation_layer.py.
          # Раньше оба скрипта писали в interpretation.json и затирали друг
          # друга; interpretation.json остаётся за старым детектором,
          # его читает daily_digest.
          [ -f data/cache/unified_reading.json ] && git add data/cache/unified_reading.json || echo "no unified_reading.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: unified reading [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Hive Prices Collector · fix price discrepancy via managed CoinGecko
  # Uses Hive Intelligence API for reliable price data
  # ============================================================
  hive_prices:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '25 0,6,12,18 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'hive_prices')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch prices via Hive Intelligence
        env:
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
        run: python3 hive/hive_price_collector.py
      - name: Commit hive_prices.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/hive_prices.json ] && git add data/cache/hive_prices.json || echo "no hive_prices.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: hive prices update [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # ARCHIVIST · снимок истории, дельты к прошлому снимку, ретеншн.
  # Сжимает снимки старше 60 дней, удаляет архивы старше 180.
  # Только локальные файлы — 0 кредитов, 0 внешних запросов.
  # ============================================================
  archivist:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '50 3 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'archivist')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Snapshot, deltas, retention
        run: python3 scripts/archivist.py
      - name: Commit history
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/history/token_scan 2>/dev/null || true
          [ -f data/cache/token_scan_deltas.json ] && git add data/cache/token_scan_deltas.json || echo "no deltas"
          [ -f data/cache/archive_status.json ] && git add data/cache/archive_status.json || echo "no status"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: archivist snapshot + deltas [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # DECISION ENGINE · единственный автор торговых решений
  # Читает все кэши, пишет decisions.json + прогноз в append-only лог.
  # Ни одного внешнего запроса — только локальные файлы. 0 кредитов.
  # ============================================================
  decision_engine:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '27 0,6,12,18 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'decision_engine')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build decisions
        run: python3 scripts/decision_engine.py
      - name: Commit decisions
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/decisions.json ] && git add data/cache/decisions.json || echo "no decisions.json"
          [ -f data/history/decision_log.jsonl ] && git add data/history/decision_log.jsonl || echo "no decision_log.jsonl"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: decisions [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # DECISION VERIFY · закрывает прогнозы, у которых наступил срок.
  # Без этого шага накопленный лог остаётся мёртвым грузом.
  # ============================================================
  decision_verify:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '40 5 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'decision_verify')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify past decisions
        run: python3 scripts/decision_engine.py --verify
      - name: Commit accuracy
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/history/decision_log.jsonl ] && git add data/history/decision_log.jsonl || echo "no log"
          [ -f data/cache/decision_accuracy.json ] && git add data/cache/decision_accuracy.json || echo "no accuracy"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: decision accuracy [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # PHASE ANALYZER · каждые 30 минут · 0 кредитов Dune
  # Считает flow_accel_4w/8w, дивергенцию цена/капитал, sanity-фильтр.
  # Читает phase_verdict из token_scan (Dune, обновляется раз в неделю)
  # и считает "что делает поток прямо сейчас" на 30-минутном такте.
  # ============================================================
  phase_analyzer:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '15,45 * * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'phase_analyzer')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze phase deltas
        run: python3 scripts/phase_analyzer.py
      - name: Commit phase_analysis.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/phase_analysis.json ] && git add data/cache/phase_analysis.json || echo "no phase_analysis"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: phase deltas [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # HL PERPS · Hyperliquid перпы каждые 30 мин · 0 кредитов
  # Публичный /info endpoint, ноль ключей, ноль тарифа.
  # Один POST даёт агрегат по 232 активам, из которых мы читаем 42.
  # ============================================================
  hl_perps:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '10,40 * * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'hl_perps')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Collect HL perps (public API, free)
        run: python3 scripts/collectors/hl_perps_collector.py
      - name: Commit hl_perps.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/hl_perps.json ] && git add data/cache/hl_perps.json || echo "no hl_perps"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: hl perps [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # HL TRADE COLLECTOR · публичные сделки HL каждые 15 мин · 0 кредитов
  # Пишет в append-only лог data/history/hl_trades.jsonl.
  # Через 2-3 дня накопится база для построения whale-watchlist.
  # ============================================================
  hl_trades:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '5,20,35,50 * * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'hl_trades')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Collect HL public trades
        run: python3 scripts/collectors/hl_trade_collector.py
      - name: Commit trades log
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/history/hl_trades.jsonl ] && git add data/history/hl_trades.jsonl || echo "no trades log"
          [ -f data/cache/hl_trades_status.json ] && git add data/cache/hl_trades_status.json || echo "no status"
          [ -f data/cache/.hl_seen_hashes.json ] && git add data/cache/.hl_seen_hashes.json || echo "no seen"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: hl trades [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # VOLUME PROFILE · POC/VAH/VAL/HVN каждые 6 часов · 0 кредитов
  # Источник — бесплатные свечи Hyperliquid (candleSnapshot).
  # Отвечает на вопрос "куда стремится цена": магниты объёма.
  # ============================================================
  volume_profile:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '35 1,7,13,19 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'volume_profile')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Build volume profiles
        run: python3 scripts/collectors/volume_profile_collector.py
      - name: Commit volume_profile.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/volume_profile.json ] && git add data/cache/volume_profile.json || echo "no vp"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: volume profile [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # CVD MULTI · агрессия покупателей/продавцов каждые 30 мин · 0 кредитов
  # OKX taker-volume по всем токенам. Ловит DISTRIBUTION_DIV
  # (цена вверх + агрессия продающая) — классический сигнал вершины.
  # ============================================================
  cvd_multi:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0,30 * * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'cvd_multi')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect CVD for all tokens
        run: python3 scripts/collectors/cvd_multi_collector.py
      - name: Commit cvd_multi.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/cvd_multi.json ] && git add data/cache/cvd_multi.json || echo "no cvd"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: cvd multi [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # DECISION BACKTEST · воскресенье 06:20 UTC · 0 кредитов
  # Прогоняет правила движка по истории weekly_history без заглядывания
  # в будущее и считает hit-rate, медиану и Sharpe-подобную метрику.
  #
  # Проверяются только правила с историей: режимы потока, серии,
  # дивергенция цена/поток. phase_verdict, CVD, Volume Profile и режим
  # рынка истории не имеют — их проверяет только форвард-тест.
  #
  # Выборка растёт сама: каждый weekly-скан добавляет неделю в историю.
  # ============================================================
  decision_backtest:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '20 6 * * 0')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'decision_backtest')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay rules over history
        run: python3 scripts/decision_backtest.py
      - name: Commit rule_backtest.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/rule_backtest.json ] && git add data/cache/rule_backtest.json || echo "no backtest"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: rule backtest [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # TRADE JOURNAL · каждые 6 часов · 0 кредитов
  # Читает data/history/trades.jsonl (заполняется вручную или через
  # Telegram) и сопоставляет с decision_log.jsonl.
  #
  # Отвечает на вопрос, которого не решает ни бэктест, ни форвард-тест:
  # следовала ли ты сигналам, и что вышло когда не следовала.
  # ============================================================
  trade_journal:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '45 2,8,14,20 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'trade_journal')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile trades with decisions
        run: python3 scripts/trade_journal.py
      - name: Commit trade_journal.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/trade_journal.json ] && git add data/cache/trade_journal.json || echo "no journal"
          [ -f data/history/trades.jsonl ] && git add data/history/trades.jsonl || echo "no trades"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: trade journal [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # ASSET COMPASS · шкала LONG/SHORT каждые 30 мин · 0 кредитов
  # Сводит три группы сигналов в один балл и показывает вклад каждой.
  # Читает decisions.json и кладёт вердикт движка рядом со своим баллом,
  # чтобы дашборд рисовал оба из одного файла и они не разошлись.
  # ============================================================
  asset_compass:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '50 * * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'asset_compass')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute compass
        run: python3 scripts/asset_compass.py
      - name: Commit asset_compass.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/asset_compass.json ] && git add data/cache/asset_compass.json || echo "no compass"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: asset compass [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Token scan · ОДИН токен по требованию (кнопка «Обновить» в модалке)
  # Dune: ~5-25 кредитов за токен. Только ручной/dispatch запуск.
  # ============================================================
  token_scan_single:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'token_scan_single'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests dune-client
      - name: Проверка входного токена
        run: |
          if [ -z "${{ github.event.inputs.token }}" ]; then
            echo "::error::Поле token пустое. Укажи символ, например LINK."
            exit 1
          fi
          echo "Сканирую ${{ github.event.inputs.token }}"
      - name: Scan single token via Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID_TOKEN_SCAN: ${{ secrets.DUNE_QUERY_ID_TOKEN_SCAN }}
        run: python3 token_scan/token_scan_collector.py --token ${{ github.event.inputs.token }}
      - name: Commit token scan
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add data/cache/token_scan/ 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: single token scan ${{ github.event.inputs.token }} [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Funding per token · КАЖДЫЕ 30 МИНУТ · OKX public · 0 кредитов
  # Binance отдаёт 451 с раннеров GitHub (geo-block), поэтому OKX.
  # ============================================================
  funding_per_token:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'funding_per_token')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch funding + open interest (OKX, free)
        run: python3 scripts/collectors/funding_per_token.py
      - name: Commit funding_per_token.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/funding_per_token.json ] && git add data/cache/funding_per_token.json || echo "no funding_per_token.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: funding per token [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Hive Health · MUST #18 (концентрация держателей) + MUST #19 (глубина 2%)
  # Тратит кредиты Hive: 2 на токен, ~30 за прогон. Dune НЕ трогает.
  # ============================================================
  hive_health:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'hive_health')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Проверка ключа
        env:
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
        run: |
          if [ -z "$HIVE_API_KEY" ]; then
            echo "::error::HIVE_API_KEY не найден в Secrets репозитория"
            exit 1
          fi
          echo "OK, ${#HIVE_API_KEY} символов"
      - name: Collect token health (MUST 18/19)
        env:
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
          HIVE_MONTHLY_BUDGET: '8000'
        run: python3 hive/hive_health_collector.py
      - name: Commit hive_token_health.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/hive_token_health.json ] && git add data/cache/hive_token_health.json || echo "no hive_token_health.json"
          [ -f data/cache/hive_credits.json ] && git add data/cache/hive_credits.json || echo "no hive_credits.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: hive token health MUST18/19 [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Hive Catalog · разведка инструментов. НОЛЬ кредитов, только ручной запуск.
  # Безопасно жать сколько угодно — GET /api/v1/tools не тарифицируется.
  # ============================================================
  hive_health_catalog:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'hive_health_catalog'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Показать каталог Hive (0 кредитов)
        env:
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
        run: python3 hive/hive_health_collector.py --catalog
      - name: Commit hive_catalog.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/hive_catalog.json ] && git add data/cache/hive_catalog.json || echo "no hive_catalog.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: hive catalog snapshot [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # Market Regime Calculator · weighted regime across all modules
  # ============================================================
  market_regime:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '22 0,6,12,18 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'market_regime')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Market Regime Calculator
        run: python3 interpretation/market_regime.py
      - name: Commit market_regime.json
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          [ -f data/cache/market_regime.json ] && git add data/cache/market_regime.json || echo "no market_regime.json"
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: market regime [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"

  # ============================================================
  # VERSION UPDATE · auto-bump on every push (for cache busting)
  # Generates VERSION.txt with unix timestamp → invalidates browser cache
  # ============================================================
  version_update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate VERSION.txt with commit info
        run: |
          echo "$(date +%s)-$(git rev-parse --short HEAD)" > VERSION.txt
          echo "Deployed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> VERSION.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> VERSION.txt
          cat VERSION.txt
      - name: Commit VERSION.txt
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          git add VERSION.txt
          git diff --cached --quiet && echo "No version change" || git commit -m "chore: bump VERSION [skip ci]"
          git push || (git pull --rebase && git push) || echo "Push failed"
