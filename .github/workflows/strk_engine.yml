name: STRK Engine Automation

on:
  schedule:
    - cron: '0 */6 * * *'
    # Еженедельный backtest: воскресенье 00:00 UTC = 03:00 MSK
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Delivery mode'
        required: true
        default: 'digest'
        type: choice
        options:
          - digest
          - liq
          - run
          - backtest

# Global env — все шаги видят все секреты
env:
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  STARKNET_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.STARKNET_ANNOUNCEMENTS_CHANNEL_ID }}
  # Squeeze bot (@strk_dynamic3_bot) — отдельный стрим
  SQUEEZE_BOT_TOKEN: ${{ secrets.SQUEEZE_BOT_TOKEN }}
  SQUEEZE_CHAT_ID: ${{ secrets.SQUEEZE_CHAT_ID }}
  STRICT_NO_TRADING: 'true'

jobs:
  composite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Prepare directories
        run: mkdir -p data/history data/cache data/reports data/validation data/dashboards data/graphs

      # ============================================================
      # STAGE 1 · MASTER COLLECTORS (all in one script)
      # ============================================================
      - name: Run all collectors (master entry)
        run: |
          if [ -f scripts/collectors/run_all_collectors.py ]; then
            python3 scripts/collectors/run_all_collectors.py
          else
            echo "::warning::scripts/collectors/run_all_collectors.py NOT FOUND - fallback: skip collectors"
          fi

      # ============================================================
      # STAGE 2 · Liquidity/staking (в отдельной секции, у них своя логика)
      # ============================================================
      - name: Liquidity shift chain (ekubo + endur + native staking + shift)
        run: |
          python3 scripts/collectors/ekubo_flow.py || true
          python3 scripts/collectors/endur_lst_flow.py || true
          python3 scripts/collectors/native_staking_flow.py || true
          python3 scripts/detectors/liquidity_shift.py || true

      # ============================================================
      # STAGE 3 · ORCHESTRATOR (flow map from edges)
      # ============================================================
      - name: Orchestrator (flow map)
        run: python3 scripts/orchestrator.py || true

      # ============================================================
      # STAGE 4 · DETECTORS
      # ============================================================
      - name: Auto-discovery
        run: python3 scripts/detectors/auto_discovery.py || true

      # Watchlist notifier — только при mode=digest (не спамить при каждом cron)
      # Так лента WATCH? синхронизируется с daily heartbeat, не с каждым LIQ/RUN
      - name: Watchlist notifier (WATCH? candidates)
        if: github.event.inputs.mode == 'digest' || github.event.schedule == '0 18 * * *' || github.event_name == 'schedule' && github.event.schedule == '0 18 * * *'
        run: python3 scripts/detectors/watchlist_notifier.py || true

      - name: Cross-window pattern
        run: python3 scripts/detectors/cross_window_pattern.py || true

      - name: Auto-decision layer
        run: python3 scripts/detectors/decision_layer.py || true

      # ⚡ Composite v2 (main brain) — writes composite_signal_v2.json
      - name: Composite detector v2 (main brain)
        env:
          COMPOSITE_SILENT: 'true'
        run: python3 scripts/detectors/composite_detector_v2.py || true

      - name: Wyckoff phase
        run: python3 scripts/detectors/wyckoff_phase.py || true

      - name: Event calendar
        run: python3 scripts/detectors/event_calendar.py || true

      - name: Concentration metrics
        run: python3 scripts/detectors/concentration_metrics.py || true

      # ⚡ Bridge activity — writes bridge_activity.json
      - name: Bridge activity
        run: python3 scripts/detectors/bridge_activity.py || true

      - name: Effort/result
        run: python3 scripts/detectors/effort_result.py || true

      - name: CVD analysis
        run: python3 scripts/detectors/cvd_analysis.py || true

      - name: CEX flow analysis
        run: python3 scripts/detectors/cex_flow.py || true

      - name: Technical momentum
        run: python3 scripts/detectors/technical_momentum.py || true

      - name: Cross-token correlation
        run: python3 scripts/detectors/cross_token_correlation.py || true

      - name: News aggregator
        run: python3 scripts/detectors/news_aggregator.py || true

      - name: Twitter nitter
        run: python3 scripts/detectors/twitter_nitter.py || true

      - name: Event layer
        run: python3 scripts/detectors/event_layer.py || true

      - name: Confluence Gate (multi-signal decision)
        run: python3 scripts/detectors/confluence_gate.py || true

      # STAGE 5 · SHADOW LAYER
      - name: Shadow postmortem
        run: python3 scripts/detectors/shadow_postmortem.py || true
      - name: Shadow voter
        env:
          STRK_RUN_ID: shadow_${{ github.run_id }}
        run: python3 scripts/detectors/shadow_voter.py || true

      # STAGE 6 · COVERT FLOW + HISTORY
      - name: Covert flow detector
        run: python3 scripts/detectors/covert_flow_detector.py || true
      - name: History postmortem
        run: python3 scripts/history_postmortem.py || true
      - name: History accumulator
        env:
          STRK_RUN_ID: hist_${{ github.run_id }}_${{ github.run_number }}
        run: python3 scripts/history_accumulator.py || true

      # STAGE 7 · SYNTHESIS
      - name: Interpretation layer
        run: python3 scripts/detectors/interpretation_layer.py || true
      - name: Scenario engine
        run: python3 scripts/scenario_engine.py || true
      - name: Cohort tracker
        run: python3 scripts/detectors/cohort_tracker.py || true
      - name: Whale auto-analysis
        run: python3 scripts/detectors/whale_auto_analysis.py || true

      # STAGE 7.5 · SQUEEZE DETECTION (отдельный стрим в @strk_dynamic3_bot)
      - name: Squeeze detector (compute state)
        run: python3 scripts/detectors/squeeze_detector.py || true

      - name: Squeeze notifier (alert to @strk_dynamic3_bot)
        run: python3 scripts/detectors/squeeze_notifier.py || true

      # STAGE 7.6 · DYNAMIC EXIT SIGNALS (для активных squeeze positions)
      - name: Dynamic exit signals
        run: python3 scripts/detectors/dynamic_exit_signals.py || true

      # STAGE 7.9 · WEEKLY BACKTEST (только воскресенье 00:00 UTC или mode=backtest)
      - name: Weekly backtest
        if: github.event.schedule == '0 0 * * 0' || github.event.inputs.mode == 'backtest'
        run: python3 scripts/weekly_backtest.py || true

      # STAGE 8 · HTML REPORT (генерируется ДО отправки, чтобы run mode мог прицепить)
      - name: Generate RUN report (HTML)
        run: python3 scripts/run_report.py || true

      # STAGE 9 · SEND (MODE = digest | liq | run)
      # По cron */6 всегда MODE=digest
      # По workflow_dispatch — MODE берётся из inputs.mode
      # SKIP если это weekly backtest run (не смешиваем)
      - name: Send Telegram delivery
        if: github.event.schedule != '0 0 * * 0' && github.event.inputs.mode != 'backtest'
        env:
          MODE: ${{ github.event.inputs.mode || 'digest' }}
        run: |
          echo "=== Delivery MODE=$MODE ==="
          python3 scripts/daily_digest.py || echo "delivery failed"

      # STAGE 10 · PERSISTENCE (bulletproof — commits ALL data/ changes)
      - name: Commit state files
        run: |
          git config user.email "bot@github.com"
          git config user.name "STRK Engine Bot"
          # git add -A подхватывает и modified и untracked — новые jsonl файлы
          # (discovery_candidates, whale_events, squeeze_alerts) больше не теряются.
          git add -A data/
          # --cached — проверяем что реально в staging area
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "=== Changes to commit: ==="
            git diff --cached --stat
            git commit -m "chore: state update (mode=${{ github.event.inputs.mode || 'digest' }}) [skip ci]"
            # retry push с rebase если удалённое было обновлено параллельным run
            git push || (git pull --rebase && git push) || echo "Push failed"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: strk-signal
          path: |
            data/cache/composite_signal_v2.json
            data/cache/agent_input.json
            data/cache/cross_window_pattern.json
            data/cache/whale_analysis.json
            data/cache/cohort_tracker.json
            data/cache/wyckoff_phase.json
            data/cache/interpretation.json
            data/cache/concentration_metrics.json
            data/cache/effort_result.json
            data/cache/cvd_analysis.json
            data/cache/cex_flow.json
            data/cache/technical_momentum.json
            data/cache/scenario_analysis.json
            data/cache/scenarios/
            data/cache/decision_log.json
            data/cache/liquidity_shift.json
            data/cache/ekubo_flow.json
            data/cache/endur_lst_flow.json
            data/cache/native_staking_flow.json
            data/cache/covert_flow_signal.json
            data/cache/shadow_calibration.json
            data/cache/discord_monitor_state.json
            data/cache/starknet_discord.json
            data/cache/whale_monitor_state.json
            data/cache/bridge_activity.json
            data/history/shadow_votes.jsonl
            data/history/all_history.jsonl
            data/history/alerts.jsonl
            data/dashboards/
            data/graphs/
            data/reports/